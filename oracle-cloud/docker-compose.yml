services:
  # Caddy Reverse Proxy with Automatic Let's Encrypt SSL/TLS
  caddy:
    image: caddy:2.7-alpine
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - omnicall-server
      - livekit

  # OmniCall Express Web & Signaling Backend
  omnicall-server:
    build:
      context: ..
      dockerfile: oracle-cloud/Dockerfile.server
    restart: unless-stopped
    network_mode: "host"
    environment:
      PORT: 3000
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://${DOMAIN:-localhost}:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-omnicall_api_key_oracle}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-omnicall_secret_change_me_12345}
      TURN_URL: turn:${DOMAIN:-localhost}:3478
      TURN_USERNAME: ${TURN_USERNAME:-omnicall}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-turnsecret123}

  # LiveKit Enterprise SFU Media Server (Host Mode = 0 docker-proxy RAM overhead)
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    network_mode: "host"
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-omnicall_api_key_oracle}: ${LIVEKIT_API_SECRET:-omnicall_secret_change_me_12345}"

  # Coturn STUN/TURN Media Relay Server (100% NAT/Firewall Bypass)
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  caddy_data:
  caddy_config:
